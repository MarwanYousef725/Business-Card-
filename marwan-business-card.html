<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مروان يوسف — بطاقة أعمال رقمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e2a24;
    --ink-deep:#081a16;
    --paper:#f1e9d8;
    --paper-soft:#e8dfc9;
    --brass:#b8863b;
    --brass-light:#d8b06a;
    --seal-red:#8c2a22;
    --text-dark:#201a12;
    --text-light:#f1e9d8;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%, rgba(184,134,59,0.08), transparent 60%),
      var(--ink);
    font-family:'Tajawal', sans-serif;
    color:var(--text-light);
    overflow-x:hidden;
  }

  /* subtle geometric kufic-inspired texture */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:0.05;
    background-image:
      repeating-linear-gradient(45deg, var(--brass-light) 0 1px, transparent 1px 42px),
      repeating-linear-gradient(-45deg, var(--brass-light) 0 1px, transparent 1px 42px);
    z-index:0;
  }

  .stage{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:48px 20px 64px;
    gap:40px;
  }

  /* ===== The card ===== */
  .card{
    position:relative;
    width:min(420px, 100%);
    background:var(--paper);
    color:var(--text-dark);
    border-radius:6px;
    padding:38px 32px 32px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.6),
      0 0 0 1px rgba(184,134,59,0.25);
    text-align:center;
    animation: press-in 0.7s cubic-bezier(.2,.9,.25,1) both;
  }

  @keyframes press-in{
    0%{ transform:scale(1.08) rotate(-1.2deg); opacity:0; }
    60%{ transform:scale(0.99) rotate(0.3deg); opacity:1; }
    100%{ transform:scale(1) rotate(0deg); }
  }

  .card::before, .card::after,
  .corner-tl, .corner-br{
    content:"";
    position:absolute;
    width:22px;
    height:22px;
    border:2.5px solid var(--brass);
  }
  .card::before{ top:10px; right:10px; border-left:none; border-bottom:none; }
  .card::after{ bottom:10px; left:10px; border-right:none; border-top:none; }
  .corner-tl{ top:10px; left:10px; border-right:none; border-bottom:none; }
  .corner-br{ bottom:10px; right:10px; border-left:none; border-top:none; }

  .eyebrow{
    font-size:12px;
    letter-spacing:0.12em;
    color:var(--seal-red);
    font-weight:700;
    margin-bottom:10px;
  }

  .name{
    font-family:'Reem Kufi', sans-serif;
    font-weight:700;
    font-size:clamp(34px, 8vw, 44px);
    line-height:1.15;
    margin:0 0 12px;
    color:var(--text-dark);
  }

  .rule{
    width:70px;
    height:2px;
    margin:0 auto 16px;
    background:linear-gradient(90deg, transparent, var(--brass), transparent);
  }

  .tagline{
    font-size:15px;
    line-height:1.9;
    color:#4a4032;
    max-width:32ch;
    margin:0 auto;
  }

  /* ===== Seals grid ===== */
  .seals-label{
    text-align:center;
    font-size:13px;
    color:#c9b98f;
    letter-spacing:0.04em;
    margin-bottom:-6px;
  }

  .seals{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:22px;
    max-width:460px;
  }

  .seal{
    --r:0deg;
    position:relative;
    width:104px;
    height:104px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    background:var(--paper);
    border:3px solid var(--brass);
    outline:2px dashed var(--brass-light);
    outline-offset:5px;
    transform:rotate(var(--r));
    transition:transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease, outline-color 0.25s ease;
    box-shadow:0 10px 18px -8px rgba(0,0,0,0.5);
  }

  .seal:nth-child(1){ --r:-4deg; }
  .seal:nth-child(2){ --r:3deg; }
  .seal:nth-child(3){ --r:-2deg; }
  .seal:nth-child(4){ --r:5deg; }
  .seal:nth-child(5){ --r:-3deg; }

  .seal span{
    font-family:'Tajawal', sans-serif;
    font-weight:900;
    font-size:15px;
    color:var(--text-dark);
    transition:color 0.25s ease;
    text-align:center;
    padding:0 8px;
    line-height:1.3;
  }

  .seal:hover, .seal:focus-visible{
    transform:rotate(0deg) scale(0.94);
    background:var(--seal-red);
    outline-color:var(--brass);
    box-shadow:0 4px 10px -4px rgba(0,0,0,0.6);
  }
  .seal:hover span, .seal:focus-visible span{
    color:var(--text-light);
  }

  .seal:focus-visible{
    outline-style:solid;
    outline-color:var(--brass-light);
  }

  footer{
    font-size:12.5px;
    color:#a99a78;
    text-align:center;
    max-width:34ch;
    line-height:1.8;
  }

  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; }
    .seal{ transition:none; }
  }

  @media (max-width:420px){
    .seal{ width:92px; height:92px; }
    .seal span{ font-size:13px; }
  }
</style>
</head>
<body>
  <div class="stage">

    <div class="card">
      <div class="corner-tl"></div>
      <div class="corner-br"></div>
      <div class="eyebrow">بطاقة أعمال رقمية</div>
      <h1 class="name">مروان يوسف</h1>
      <div class="rule"></div>
      <p class="tagline">خمس منصات، وختم واحد للثقة — نتائج توثّقها المنصات نفسها.</p>
    </div>

    <div>
      <p class="seals-label">اضغط على أي ختم للانتقال إلى الملف الشخصي</p>
    </div>

    <div class="seals">
      <a class="seal" href="https://khamsat.com/user/marwanyouseff" target="_blank" rel="noopener noreferrer" aria-label="الملف الشخصي على خمسات">
        <span>خمسات</span>
      </a>
      <a class="seal" href="https://mostaql.com/u/marwanyouseff" target="_blank" rel="noopener noreferrer" aria-label="الملف الشخصي على مستقل">
        <span>مستقل</span>
      </a>
      <a class="seal" href="https://kafiil.com/u/mroan_yosf" target="_blank" rel="noopener noreferrer" aria-label="الملف الشخصي على كفيل">
        <span>كفيل</span>
      </a>
      <a class="seal" href="https://nafezly.com/u/marwan_yousef" target="_blank" rel="noopener noreferrer" aria-label="الملف الشخصي على نفذلي">
        <span>نفذلي</span>
      </a>
      <a class="seal" href="https://app.outlier.ai/profile" target="_blank" rel="noopener noreferrer" aria-label="الملف الشخصي على Outlier">
        <span>Outlier</span>
      </a>
    </div>

    <footer>جميع الروابط تفتح في صفحة جديدة — الملف يبقى مفتوحًا لديك.</footer>

  </div>
</body>
</html>
